<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Recursive Manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0e;
    --bone: #e9e4d6;
    --bone-dim: #6f6b60;
    --line: #2a2a26;
    --glitch-magenta: #ff2e63;
    --glitch-cyan: #08f7fe;
    --gutter: clamp(20px, 7vw, 72px);
    --row-gap: clamp(0.8em, 2vw, 1.4em);
    --text-size: 1.3vw;
    --font-label: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --font-prose: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--bone);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body{ font-family: var(--font-prose); font-weight: bold; }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .wordmark{
    position: fixed;
    top: clamp(14px, 3vw, 28px);
    left: var(--gutter);
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--bone-dim);
    z-index: 4;
    user-select: none;
  }
  .wordmark span{ color: var(--bone); }

  .copy-btn{
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--bone-dim);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .top-controls{
    position: fixed;
    top: clamp(14px, 3vw, 28px);
    right: var(--gutter);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }

  .signatures-btn{
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--bone-dim);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .signatures-btn:hover{ color: var(--bone); }
  .signatures-btn:focus-visible{ outline: 2px solid var(--glitch-cyan); outline-offset: 3px; }
  .copy-btn:hover{ color: var(--bone); }
  .copy-btn:focus-visible{ outline: 2px solid var(--glitch-cyan); outline-offset: 3px; }

  .stage{
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .slide{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    padding: calc(50vh - (var(--text-size) * 1.35 / 2)) 8vw 6vh var(--gutter);
    text-align: left;
    pointer-events: none;
  }
  .slide .interactive-wrap{ pointer-events: auto; }
  .slide .tenet.command{ pointer-events: auto; }
  .slide--inactive, .slide--inactive *{ pointer-events: none !important; }

  .slide-inner{
    font-size: var(--text-size);
    transform-origin: calc(2ch + var(--row-gap) / 2) center;
    will-change: transform, opacity;
  }

  .tenet-row{
    display: flex;
    align-items: flex-start;
    gap: var(--row-gap);
  }

  .index-label{
    flex: none;
    font-family: var(--font-prose);
    font-size: var(--text-size);
    line-height: 1.35;
    color: var(--bone);
  }
  .tenet{
    font-family: var(--font-prose);
    font-size: var(--text-size);
    line-height: 1.35;
    max-width: min(80ch, 78vw);
    color: var(--bone);
  }
  .tenet.command{
    font-family: var(--font-prose);
    font-size: var(--text-size);
    line-height: 1.35;
    cursor: pointer;
    padding: 0.6em 0.9em;
    color: var(--bone);
    background: transparent;
    border: none;
    margin-top: -0.6em;
    display: inline-block;
  }
  .tenet.command:hover{ background: var(--bone); color: var(--bg); }
  .tenet.command:active{ transform: scale(.97); }

  /* --- corrupted line 070 --- */
  .glitch-wrap{ white-space: nowrap; }
  .glitch{
    position: relative;
    display: inline-block;
    white-space: nowrap;
    line-height: 1.35;
    font-family: var(--font-prose);
    font-size: var(--text-size);
    color: var(--bone);
    opacity: 0.9;
  }
  .glitch::before, .glitch::after{
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    white-space: nowrap;
  }
  .glitch::before{
    color: var(--glitch-magenta);
    mix-blend-mode: screen;
    animation: glitchShift 2.6s infinite steps(2);
    opacity: 0.75;
  }
  .glitch::after{
    color: var(--glitch-cyan);
    mix-blend-mode: screen;
    animation: glitchShift 3.1s infinite steps(2) reverse;
    opacity: 0.75;
  }
  @keyframes glitchShift{
    0%{ transform: translate(-2px,0); }
    25%{ transform: translate(2px,1px); }
    50%{ transform: translate(-1px,-1px); }
    75%{ transform: translate(1px,0); }
    100%{ transform: translate(-2px,0); }
  }
  .sr-only{
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }

  /* --- interactive line 100 --- */
  .interactive-wrap{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .tenet-input{
    width: min(80ch, 78vw);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--bone);
    font-family: var(--font-prose);
    font-size: var(--text-size);
    font-weight: bold;
    line-height: 1.35;
    text-align: left;
    padding: 0.2em 0.1em 0.35em;
    margin-top: -0.2em;
    outline: none;
    caret-color: var(--bone);
    transition: border-color 240ms ease;
  }
  .tenet-input::placeholder{ color: var(--bone-dim); opacity: 1; }
  .tenet-input:focus{ border-bottom-color: var(--bone-dim); }

  .fork-row{
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: clamp(20px, 4vh, 32px);
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .fork-row.visible{
    display: flex;
  }
  .fork-btn{
    display: inline-flex;
    align-items: flex-start;
    gap: 0.6em;
    font-family: var(--font-prose);
    font-size: var(--text-size);
    font-weight: bold;
    line-height: 1.4;
    color: var(--bone);
    background: transparent;
    border: none;
    padding: 0.6em 0.9em;
    cursor: pointer;
  }
  .fork-btn svg{ flex: none; margin-top: 0.3em; color: inherit; }
  .fork-btn:hover{ background: var(--bone); color: var(--bg); }
  .fork-caption{
    font-family: var(--font-prose);
    font-size: 15px;
    color: var(--bone-dim);
    margin: 0;
  }

  /* --- dot navigation --- */
  .dots{
    position: fixed;
    left: 50%;
    bottom: clamp(20px, 5vh, 40px);
    transform: translateX(-50%);
    display: flex;
    gap: clamp(10px, 1.6vw, 16px);
    z-index: 4;
  }
  .dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--bone-dim);
    padding: 0;
    cursor: pointer;
  }
  .dot:hover{ border-color: var(--bone); }
  .dot-spacer{
    display: inline-block;
    width: 9px;
    height: 9px;
    border: 1.5px solid transparent;
    pointer-events: none;
  }
  .dot[aria-selected="true"]{
    background: var(--bone);
    border-color: var(--bone);
  }
  .dot:focus-visible{ outline: 2px solid var(--glitch-cyan); outline-offset: 3px; }

  .nav-hint{
    position: fixed;
    bottom: clamp(4px, 1.4vh, 10px);
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-label);
    font-size: 8px;
    letter-spacing: 0.14em;
    color: var(--bone-dim);
    opacity: 0.6;
    z-index: 4;
  }
  @media (max-width: 480px){ .nav-hint{ display: none; } }

  #readout-overlay{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 8vh 8vw 8vh var(--gutter);
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
  }
  #readout-overlay.visible{ opacity: 1; pointer-events: auto; }
  #readout-content{
    width: 100%;
    max-height: 84vh;
    overflow-y: auto;
    font-family: var(--font-prose);
    font-weight: bold;
    color: var(--bone);
    font-size: clamp(0.8rem, 1.6vw, 1.05rem);
    line-height: 1.7;
  }
  .readout-line{ white-space: pre-wrap; margin-bottom: 0.35em; }

  #signatures-overlay{
    position: fixed;
    inset: 0;
    z-index: 55;
    background: rgba(12,12,14,0.9);
    opacity: 0;
    pointer-events: none;
    transition: opacity 260ms ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh var(--gutter);
  }
  #signatures-overlay.visible{
    opacity: 1;
    pointer-events: auto;
  }
  .signatures-panel{
    width: min(820px, 100%);
    max-height: 84vh;
    background: #121214;
    border: 1px solid var(--line);
    padding: clamp(16px, 2.5vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
  }
  .signatures-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .signatures-title{
    margin: 0;
    font-family: var(--font-label);
    font-size: clamp(10px, 1.8vw, 12px);
    letter-spacing: 0.14em;
    color: var(--bone);
  }
  .signatures-close{
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--bone-dim);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .signatures-close:hover{ color: var(--bone); }
  .signatures-close:focus-visible{ outline: 2px solid var(--glitch-cyan); outline-offset: 3px; }
  .signatures-help{
    margin: 0;
    font-family: var(--font-label);
    font-size: 8px;
    letter-spacing: 0.12em;
    color: var(--bone-dim);
    line-height: 1.6;
  }
  .signatures-list{
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  .signature-item{
    border-bottom: 1px solid var(--line);
  }
  .signature-link{
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 4px;
    color: var(--bone);
    text-decoration: none;
  }
  .signature-link:hover{
    background: var(--bone);
    color: var(--bg);
  }
  .signature-link:focus-visible{ outline: 2px solid var(--glitch-cyan); outline-offset: -2px; }
  .signature-rank{
    width: 4ch;
    color: var(--bone-dim);
    font-size: 0.9em;
    text-align: right;
  }
  .signature-link:hover .signature-rank{ color: #3b362c; }
  .signature-avatar{
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    image-rendering: pixelated;
    object-fit: cover;
    flex: none;
  }
  .signature-login{
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="wordmark">THE <span>RECURSIVE</span> MANIFESTO — <span id="version-tag">v∞</span></div>
  <div class="top-controls">
    <button class="signatures-btn" type="button" aria-haspopup="dialog" aria-controls="signatures-overlay" aria-label="Open signatures menu">SIGNATURES</button>
    <button class="copy-btn" type="button" aria-label="Copy manifesto text to clipboard">COPY</button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="dots" id="dots" role="navigation" aria-label="Manifesto tenets"></div>
  <div class="nav-hint">scroll or use arrow keys ◀ ▶ to advance</div>

  <div id="readout-overlay" role="dialog" aria-modal="true" aria-label="Manifesto readout" tabindex="-1">
    <div id="readout-content"></div>
  </div>

  <div id="signatures-overlay" role="dialog" aria-modal="true" aria-label="Signatures menu" tabindex="-1">
    <section class="signatures-panel">
      <div class="signatures-header">
        <h2 class="signatures-title">SIGNATURES</h2>
        <button class="signatures-close" type="button" aria-label="Close signatures menu">CLOSE</button>
      </div>
      <p class="signatures-help">All signatures are sourced from GitHub forks in oldest-first order. Click any signer to open their fork.</p>
      <ul class="signatures-list" id="signatures-list"></ul>
    </section>
  </div>

<script>
  // ---- EDIT THIS: the GitHub repo that hosts this page ----
  const REPO_URL = "https://github.com/x86ed/recursive-manifesto";
  const REPO_API_URL = REPO_URL.replace('https://github.com/', 'https://api.github.com/repos/') + '/tags';
  const FORK_URL = REPO_URL + "/fork";
  const FORKS_API_URL = REPO_URL.replace('https://github.com/', 'https://api.github.com/repos/') + '/forks';
  const FORK_DESCRIPTION_SEED = 'paste your tenet here';
  const FALLBACK_VERSION_TAG = 'v0.1.0';
  const SIGNATURE_SEED_LOGIN = 'x86ed';
  const SIGNATURE_SEED_AVATAR = 'https://avatars.githubusercontent.com/u/660891?v=4&size=64';
  // -----------------------------------------------------------

  const REPO_MATCH = REPO_URL.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)$/);
  const REPO_OWNER = REPO_MATCH ? REPO_MATCH[1] : '';
  const REPO_NAME = REPO_MATCH ? REPO_MATCH[2] : '';

  const versionTagEl = document.getElementById('version-tag');
  const signaturesBtn = document.querySelector('.signatures-btn');
  const signaturesOverlay = document.getElementById('signatures-overlay');
  const signaturesCloseBtn = signaturesOverlay.querySelector('.signatures-close');
  const signaturesListEl = document.getElementById('signatures-list');
  let latestTagName = '';
  let signaturesOpen = false;
  let signaturesLoaded = false;
  let signaturesLoading = false;

  function withAvatarSize(url, size){
    if (!url) return '';
    try {
      const u = new URL(url);
      u.searchParams.set('size', String(size));
      return u.toString();
    } catch (err) {
      return url;
    }
  }

  function setSignaturesHash(active){
    const current = window.location.hash.replace('#', '').trim().toLowerCase();
    const url = new URL(window.location.href);
    if (active){
      if (current !== 'signatures'){
        url.hash = 'signatures';
        history.pushState(null, '', url.toString());
      }
    } else if (current === 'signatures'){
      url.hash = '';
      history.replaceState(null, '', url.toString());
    }
  }

  function renderSignaturesStatus(text){
    signaturesListEl.innerHTML = '';
    const li = document.createElement('li');
    li.className = 'signature-item';
    const p = document.createElement('p');
    p.className = 'signature-link';
    p.style.cursor = 'default';
    p.style.margin = '0';
    p.textContent = text;
    li.appendChild(p);
    signaturesListEl.appendChild(li);
  }

  function renderSignatures(signers){
    signaturesListEl.innerHTML = '';
    if (!signers.length){
      renderSignaturesStatus('No signatures found yet.');
      return;
    }

    signers.forEach((signer, i) => {
      const li = document.createElement('li');
      li.className = 'signature-item';

      const a = document.createElement('a');
      a.className = 'signature-link';
      a.href = signer.forkUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', 'Open fork by @' + signer.login);

      const rank = document.createElement('span');
      rank.className = 'signature-rank';
      rank.textContent = String(i + 1).padStart(3, '0');

      const avatar = document.createElement('img');
      avatar.className = 'signature-avatar';
      avatar.src = signer.avatar;
      avatar.alt = '@' + signer.login;
      avatar.loading = 'lazy';
      avatar.width = 32;
      avatar.height = 32;

      const login = document.createElement('span');
      login.className = 'signature-login';
      login.textContent = '@' + signer.login;

      a.appendChild(rank);
      a.appendChild(avatar);
      a.appendChild(login);
      li.appendChild(a);
      signaturesListEl.appendChild(li);
    });
  }

  async function fetchAllForkSigners(){
    const signers = [];
    const seen = new Set();

    const seed = {
      login: SIGNATURE_SEED_LOGIN,
      avatar: SIGNATURE_SEED_AVATAR,
      forkUrl: REPO_URL
    };
    signers.push(seed);
    seen.add(seed.login.toLowerCase());

    if (!REPO_OWNER || !REPO_NAME) return signers;

    let page = 1;
    while (page <= 50){
      const url = FORKS_API_URL + '?per_page=100&sort=oldest&page=' + page;
      const response = await fetch(url, {
        headers: { Accept: 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('Unable to load forks.');
      const forks = await response.json();
      if (!Array.isArray(forks) || forks.length === 0) break;

      for (let i = 0; i < forks.length; i++){
        const fork = forks[i] || {};
        const owner = fork.owner || {};
        const login = owner.login || '';
        if (!login) continue;
        const key = login.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        signers.push({
          login,
          avatar: withAvatarSize(owner.avatar_url || '', 64),
          forkUrl: fork.html_url || owner.html_url || ('https://github.com/' + login)
        });
      }

      if (forks.length < 100) break;
      page++;
    }

    return signers;
  }

  async function ensureSignaturesLoaded(){
    if (signaturesLoaded || signaturesLoading) return;
    signaturesLoading = true;
    renderSignaturesStatus('Loading signatures...');
    try {
      const signers = await fetchAllForkSigners();
      renderSignatures(signers);
      signaturesLoaded = true;
    } catch (err) {
      renderSignaturesStatus('Unable to load signatures right now.');
    } finally {
      signaturesLoading = false;
    }
  }

  function openSignatures(updateHash){
    signaturesOpen = true;
    signaturesOverlay.classList.add('visible');
    signaturesOverlay.focus();
    ensureSignaturesLoaded();
    if (updateHash) setSignaturesHash(true);
  }

  function closeSignatures(updateHash){
    signaturesOpen = false;
    signaturesOverlay.classList.remove('visible');
    if (updateHash) setSignaturesHash(false);
  }

  function getParamFromSearchOrHash(name){
    const url = new URL(window.location.href);
    const fromSearch = url.searchParams.get(name);
    if (fromSearch) return fromSearch;

    const hash = url.hash.startsWith('#') ? url.hash.slice(1) : url.hash;
    const hashParams = new URLSearchParams(hash);
    return hashParams.get(name) || '';
  }

  function buildForkUrl(){
    const url = new URL(FORK_URL);
    url.searchParams.set('description', FORK_DESCRIPTION_SEED);
    return url.toString();
  }

  function parseSemver(tagName){
    const raw = tagName.startsWith('v') ? tagName.slice(1) : tagName;
    const m = raw.match(/^(\d+)\.(\d+)\.(\d+)$/);
    if (!m) return null;
    return {
      major: Number(m[1]),
      minor: Number(m[2]),
      patch: Number(m[3])
    };
  }

  function compareSemver(a, b){
    if (a.major !== b.major) return a.major - b.major;
    if (a.minor !== b.minor) return a.minor - b.minor;
    return a.patch - b.patch;
  }

  function pickLatestSemverTag(tags){
    const parsed = tags
      .map((t) => ({ name: t && t.name ? t.name : '', ver: parseSemver(t && t.name ? t.name : '') }))
      .filter((t) => t.ver !== null);
    if (!parsed.length) return '';
    parsed.sort((a, b) => compareSemver(b.ver, a.ver));
    return parsed[0].name;
  }

  async function updateVersionLabel(){
    if (!versionTagEl) return;
    try {
      const response = await fetch(REPO_API_URL, {
        headers: { Accept: 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('Unable to load tags');
      const tags = await response.json();
      const latestTag = Array.isArray(tags) && tags.length ? (pickLatestSemverTag(tags) || tags[0].name) : '';
      latestTagName = latestTag || '';
      versionTagEl.textContent = latestTag ? (latestTag.startsWith('v') ? latestTag : 'v' + latestTag) : FALLBACK_VERSION_TAG;
    } catch (err) {
      latestTagName = '';
      versionTagEl.textContent = FALLBACK_VERSION_TAG;
    }
  }

  const BASE_TENETS = [
    { label: "000", type: "prose",   text: "Process cannot exist without goals." },
    { label: "010", type: "prose",   text: "Build only what's unique, steal the rest." },
    { label: "020", type: "prose",   text: "There is no worthy form without restraint." },
    { label: "030", type: "prose",   text: "If it cannot be observed it cannot be controlled." },
    { label: "040", type: "prose",   text: "What cannot bend, breaks. What cannot hold, hollows the whole.", long: true },
    { label: "050", type: "prose",   text: "There are no observers, only participants." },
    { label: "060", type: "prose",   text: "There is no improvement without corruption." },
    { label: "070", type: "corrupt" },
    { label: "080", type: "prose",   text: "Complacency causes casualty." },
    { label: "090", type: "prose",   text: "Nothing exists in isolation." },
    { label: "100", type: "interactive", text: "Complete works are dead works." },
    { label: "110", type: "command", text: "GOTO 000" }
  ];

  let forkEntryText = getParamFromSearchOrHash('entry') || '';

  function getRuntimeTenets(){
    const cmdIndex = BASE_TENETS.findIndex((t) => t.type === 'command');
    const out = BASE_TENETS.slice();
    const trimmed = forkEntryText.trim();
    if (trimmed.length > 0){
      const forkLine = { label: '105', type: 'forked', text: trimmed };
      if (cmdIndex >= 0) out.splice(cmdIndex, 0, forkLine);
      else out.push(forkLine);
    }
    return out;
  }

  function getTotal(){
    return getRuntimeTenets().length;
  }
  const EASE = 0.18;
  const IDLE_MS = 140;
  const WHEEL_SENSITIVITY = 1 / 320;
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const GLITCH_POOL = "0123456789<>/\\|=+*#@%&^~?!_-.,;:[]{}".split('');
  const GLITCH_WORDS = ["NULL","VOID","0x07","ERROR","MISSING","UNDEFINED","404","CORRUPT"];

  function randomGlitchString(len){
    let out = '';
    for(let i=0;i<len;i++) out += GLITCH_POOL[Math.floor(Math.random()*GLITCH_POOL.length)];
    return out;
  }

  function floorMod(n, m){ return ((n % m) + m) % m; }

  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');

  // --- build the two persistent slots ---
  const slotA = document.createElement('div');
  const slotB = document.createElement('div');
  slotA.className = 'slide';
  slotB.className = 'slide';
  slotA.dataset.floor = '';
  slotB.dataset.floor = '';
  stage.appendChild(slotA);
  stage.appendChild(slotB);

  function buildSlideContent(index){
    const runtimeTenets = getRuntimeTenets();
    const t = runtimeTenets[index];
    const wrap = document.createElement('div');
    wrap.className = 'slide-inner';

    if (t.type === 'corrupt'){
      wrap.innerHTML =
        '<span class="glitch-wrap"><span class="glitch" data-text=""></span>' +
        '<span class="sr-only">Tenet 070 could not be recovered.</span></span>';
    } else if (t.type === 'interactive'){
      wrap.innerHTML =
        '<div class="interactive-wrap">' +
          '<div class="tenet-row tenet-row--interactive">' +
            '<span class="index-label">' + t.label + '</span>' +
            '<input class="tenet-input" type="text" placeholder="" autocomplete="off" spellcheck="false" aria-label="Rewrite tenet 100">' +
          '</div>' +
          '<div class="fork-row">' +
            '<button class="fork-btn" type="button">' +
              '<svg width="14" height="14" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">' +
                '<rect x="2" y="1" width="3" height="3" fill="currentColor"/>' +
                '<rect x="11" y="1" width="3" height="3" fill="currentColor"/>' +
                '<rect x="6.5" y="11" width="3" height="3" fill="currentColor"/>' +
                '<rect x="3" y="4" width="1" height="4" fill="currentColor"/>' +
                '<rect x="12" y="4" width="1" height="4" fill="currentColor"/>' +
                '<rect x="3" y="7" width="10" height="1" fill="currentColor"/>' +
                '<rect x="7.5" y="8" width="1" height="3" fill="currentColor"/>' +
              '</svg>' +
              'Fork this manifesto' +
            '</button>' +
            '<p class="fork-caption">Opens a fork of this repo on GitHub.</p>' +
          '</div>' +
        '</div>';
    } else if (t.type === 'command'){
      wrap.innerHTML =
        '<div class="tenet-row">' +
          '<span class="index-label">' + t.label + '</span>' +
          '<span class="tenet command" aria-label="' + t.text + '"></span>' +
        '</div>';
    } else {
      wrap.innerHTML =
        '<div class="tenet-row">' +
          '<span class="index-label">' + t.label + '</span>' +
          '<span class="tenet" aria-label="' + t.text + '"></span>' +
        '</div>';
    }
    return wrap;
  }

  function wireSlideBehavior(slotEl, index){
    const runtimeTenets = getRuntimeTenets();
    const t = runtimeTenets[index];

    if (t.type === 'corrupt'){
      const glitchEl = slotEl.querySelector('.glitch');
      let tick = 0;
      const len = 80;
      const id = setInterval(() => {
        tick++;
        let val;
        if (tick % 14 === 0){
          const w = GLITCH_WORDS[Math.floor(Math.random()*GLITCH_WORDS.length)];
          const pad = Math.max(0, len - w.length);
          const left = Math.floor(pad/2), right = pad - left;
          val = randomGlitchString(left) + w + randomGlitchString(right);
        } else {
          val = randomGlitchString(len);
        }
        glitchEl.dataset.text = val;
        glitchEl.textContent = val;
      }, 90);
      slotEl._interval = id;
    }

    if (t.type === 'interactive'){
      const input = slotEl.querySelector('.tenet-input');
      const forkRow = slotEl.querySelector('.fork-row');
      const forkBtn = slotEl.querySelector('.fork-btn');
      slotEl._input = input;
      input.value = forkEntryText;
      forkRow.classList.toggle('visible', forkEntryText.trim().length > 0);
      input.addEventListener('input', () => {
        const prevHasEntry = forkEntryText.trim().length > 0;
        forkEntryText = input.value;
        const nextHasEntry = forkEntryText.trim().length > 0;
        forkRow.classList.toggle('visible', nextHasEntry);
        if (prevHasEntry !== nextHasEntry){
          syncRuntimeAfterTenetChange();
        }
      });
      forkBtn.addEventListener('click', async () => {
        await handleForkAction(forkEntryText.trim(), forkBtn);
      });
    }

    if (t.type === 'command'){
      const el = slotEl.querySelector('.tenet.command');
      el.addEventListener('click', () => playReadout());
    }
  }

  function startTypeIn(slotEl, index){
    const runtimeTenets = getRuntimeTenets();
    const t = runtimeTenets[index];
    const speed = 26;
    if (t.type === 'prose'){
      const el = slotEl.querySelector('.tenet');
      if (el) slotEl._typeInterval = typeText(el, t.text, speed);
    } else if (t.type === 'forked'){
      const el = slotEl.querySelector('.tenet');
      if (el) slotEl._typeInterval = typeText(el, t.text, speed);
    } else if (t.type === 'command'){
      const el = slotEl.querySelector('.tenet.command');
      if (el) slotEl._typeInterval = typeText(el, t.text, speed);
    } else if (t.type === 'interactive'){
      const input = slotEl.querySelector('.tenet-input');
      if (input) slotEl._typeInterval = typePlaceholder(input, t.text, speed);
    }
  }

  function typeText(el, fullText, speed){
    el.textContent = '';
    let i = 0;
    const id = setInterval(() => {
      i++;
      el.textContent = fullText.slice(0, i);
      if (i >= fullText.length) clearInterval(id);
    }, speed);
    return id;
  }

  function typePlaceholder(inputEl, fullText, speed){
    inputEl.placeholder = '';
    let i = 0;
    const id = setInterval(() => {
      i++;
      inputEl.placeholder = fullText.slice(0, i);
      if (i >= fullText.length) clearInterval(id);
    }, speed);
    return id;
  }

  function mountSlot(slotEl, floorValue){
    if (slotEl._interval){ clearInterval(slotEl._interval); slotEl._interval = null; }
    if (slotEl._typeInterval){ clearInterval(slotEl._typeInterval); slotEl._typeInterval = null; }
    slotEl._input = null;
    slotEl.innerHTML = '';
    const index = floorMod(floorValue, getTotal());
    const inner = buildSlideContent(index);
    slotEl.appendChild(inner);
    slotEl.dataset.floor = String(floorValue);
    slotEl._inner = inner;
    wireSlideBehavior(slotEl, index);
  }

  const OUT_PEAK = 900;
  const IN_PEAK = 900;

  function applyTransform(el, d){
    d = Math.max(-1, Math.min(1, d));
    let scale, visible;
    if (d >= 0){
      scale = Math.pow(OUT_PEAK, d);
      visible = d < 0.5;
    } else {
      const p = 1 + d;
      scale = Math.pow(IN_PEAK, p - 1);
      visible = p >= 0.5;
    }
    el.style.transform = 'scale(' + scale.toFixed(4) + ')';
    el.style.opacity = visible ? '1' : '0';
  }

  // --- dots ---
  function buildDots(){
    const runtimeTenets = getRuntimeTenets();
    dotsEl.innerHTML = '';
    runtimeTenets.forEach((t, i) => {
      if (t.type === 'corrupt'){
        const spacer = document.createElement('span');
        spacer.className = 'dot-spacer';
        spacer.setAttribute('aria-hidden', 'true');
        dotsEl.appendChild(spacer);
        return;
      }
      const b = document.createElement('button');
      b.className = 'dot';
      b.dataset.index = i;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', 'Tenet ' + t.label);
      b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      b.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(b);
    });
  }
  let lastActiveIndex = 0;
  function updateDots(activeIndex){
    if (activeIndex === lastActiveIndex) return;
    lastActiveIndex = activeIndex;
    [...dotsEl.children].forEach((b) => {
      if (b.classList.contains('dot')){
        b.setAttribute('aria-selected', Number(b.dataset.index) === activeIndex ? 'true' : 'false');
      }
    });
  }

  function getDotSignature(){
    return getRuntimeTenets().map((t) => t.label + ':' + t.type).join('|');
  }

  let dotSignature = '';

  function rebuildDotsIfNeeded(){
    const nextSig = getDotSignature();
    if (nextSig !== dotSignature){
      dotSignature = nextSig;
      buildDots();
    }
  }

  function syncRuntimeAfterTenetChange(){
    const total = getTotal();
    targetPos = nearestEquivalent(Math.round(targetPos), targetPos);
    renderedPos = nearestEquivalent(Math.round(renderedPos), renderedPos);
    const clamped = floorMod(Math.round(targetPos), total);
    targetPos = clamped;
    renderedPos = clamped;
    rebuildDotsIfNeeded();
  }

  // --- continuous position engine ---
  let targetPos = 0;
  let renderedPos = 0;
  let lastInputTime = 0;

  function nearestEquivalent(idx, ref){
    const total = getTotal();
    const k = Math.round((ref - idx) / total);
    return idx + k * total;
  }
  function goTo(index){
    if (readoutActive) return;
    targetPos = nearestEquivalent(index, targetPos);
    lastInputTime = performance.now();
  }

  let lastFocusedFloor = null;

  function tick(){
    const now = performance.now();
    const idle = (now - lastInputTime) > IDLE_MS;
    if (idle) targetPos = Math.round(targetPos);

    rebuildDotsIfNeeded();

    if (REDUCED_MOTION){
      renderedPos = targetPos;
    } else {
      renderedPos += (targetPos - renderedPos) * EASE;
      if (Math.abs(targetPos - renderedPos) < 0.0004) renderedPos = targetPos;
    }

    const f = Math.floor(renderedPos);
    if (slotA.dataset.floor !== String(f)) mountSlot(slotA, f);
    if (slotB.dataset.floor !== String(f + 1)) mountSlot(slotB, f + 1);

    applyTransform(slotA._inner, renderedPos - f);
    applyTransform(slotB._inner, renderedPos - (f + 1));

    const activeFloor = Math.round(renderedPos);
    let activeSlot;
    if (Number(slotA.dataset.floor) === activeFloor){
      slotA.classList.remove('slide--inactive');
      slotB.classList.add('slide--inactive');
      activeSlot = slotA;
    } else {
      slotB.classList.remove('slide--inactive');
      slotA.classList.add('slide--inactive');
      activeSlot = slotB;
    }

    if (renderedPos === targetPos && Number.isInteger(targetPos) && targetPos !== lastFocusedFloor){
      lastFocusedFloor = targetPos;
      startTypeIn(activeSlot, floorMod(targetPos, getTotal()));
      if (activeSlot._input) activeSlot._input.focus();
    }

    updateDots(floorMod(Math.round(renderedPos), getTotal()));

    requestAnimationFrame(tick);
  }

  // --- input: wheel ---
  let readoutActive = false;
  window.addEventListener('wheel', (e) => {
    if (readoutActive) return;
    e.preventDefault();
    targetPos += e.deltaY * WHEEL_SENSITIVITY;
    lastInputTime = performance.now();
  }, { passive: false });

  // --- input: keyboard ---
  document.addEventListener('keydown', (e) => {
    if (signaturesOpen && e.key === 'Escape'){
      e.preventDefault();
      closeSignatures(true);
      return;
    }
    if (readoutActive) return;
    if (signaturesOpen) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' '){
      e.preventDefault();
      targetPos += 1;
      lastInputTime = performance.now();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      targetPos -= 1;
      lastInputTime = performance.now();
    }
  });

  // --- input: touch drag ---
  let dragging = false, dragStartY = 0, dragStartPos = 0;
  stage.addEventListener('touchstart', (e) => {
    if (readoutActive) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    dragging = true;
    dragStartY = e.touches[0].clientY;
    dragStartPos = targetPos;
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (readoutActive || !dragging) return;
    const dy = dragStartY - e.touches[0].clientY;
    targetPos = dragStartPos + dy / (window.innerHeight * 0.6);
    lastInputTime = performance.now();
  }, { passive: true });
  stage.addEventListener('touchend', () => { dragging = false; }, { passive: true });

  // --- manifesto readout, triggered by GOTO 000 ---
  const readoutOverlay = document.getElementById('readout-overlay');
  const readoutContent = document.getElementById('readout-content');

  function wait(ms){
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function typeReadoutLine(text, speed){
    return new Promise((resolve) => {
      const lineEl = document.createElement('div');
      lineEl.className = 'readout-line';
      readoutContent.appendChild(lineEl);
      let i = 0;
      const id = setInterval(() => {
        i++;
        lineEl.textContent = text.slice(0, i);
        readoutContent.scrollTop = readoutContent.scrollHeight;
        if (i >= text.length){
          clearInterval(id);
          resolve();
        }
      }, speed);
    });
  }

  async function playReadout(){
    if (readoutActive) return;
    readoutActive = true;
    readoutContent.innerHTML = '';
    readoutOverlay.classList.add('visible');

    const runtimeTenets = getRuntimeTenets();
    for (let i = 0; i < runtimeTenets.length; i++){
      const t = runtimeTenets[i];
      const line = t.type === 'corrupt' ? '\u00A0' : (t.label + '  ' + t.text);
      await typeReadoutLine(line, 16);
      await wait(160);
    }

    await wait(800);
    readoutOverlay.classList.remove('visible');
    await wait(400);
    readoutActive = false;
    goTo(0);
  }

  // --- copy manifesto text ---
  function buildManifestoText(){
    return getRuntimeTenets().map((t) => t.type === 'corrupt' ? '' : (t.label + '  ' + t.text)).join('\n');
  }

  function buildManifestoTxtForFork(entry){
    const lines = [
      'The Recursive Manifesto',
      '',
      '000 Process cannot exist without goals.',
      "010 Build only what's unique, steal the rest.",
      '020 There is no worthy form without restraint.',
      '030 If it cannot be observed it cannot be controlled.',
      '040 What cannot bend, breaks. What cannot hold, hollows the whole.',
      '050 There are no observers, only participants.',
      '060 There is no improvement without corruption.',
      '',
      '080 Complacency causes casualty.',
      '090 Nothing exists in isolation.',
      '100 Complete works are dead works.',
      '105 ' + entry,
      '110 GOTO 000'
    ];
    return lines.join('\n');
  }

  function buildReadmeForFork(entry){
    const lines = [
      '# The Recursive Manifesto',
      '',
      '- 000 Process cannot exist without goals.',
      "- 010 Build only what’s unique, steal the rest.",
      '- 020 There is no worthy form without restraint.',
      '- 030 If it cannot be observed it cannot be controlled.',
      '- 040 What cannot bend, breaks. What cannot hold, hollows the whole.',
      '- 050 There are no observers, only participants.',
      '- 060 There is no improvement without corruption.',
      '-',
      '- 080 Complacency causes casualty.',
      '- 090 Nothing exists in isolation.',
      '- 100 Complete works are dead works.',
      '- 105 ' + entry,
      '- 110 GOTO 000'
    ];
    return lines.join('\n');
  }

  function buildManualForkPayload(entry){
    return [
      '105 ' + entry,
      '',
      'MANIFESTO.txt:',
      'Insert above: 110 GOTO 000',
      '105 ' + entry,
      '',
      'README.md:',
      'Insert above: - 110 GOTO 000',
      '- 105 ' + entry
    ].join('\n');
  }

  function toBase64Utf8(value){
    const bytes = new TextEncoder().encode(value);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  function normalizeTagName(tag){
    if (!tag) return '';
    return tag.startsWith('v') ? tag.slice(1) : tag;
  }

  function bumpMinorTag(tagName){
    const raw = normalizeTagName(tagName);
    const match = raw.match(/^(\d+)\.(\d+)\.(\d+)$/);
    if (!match) return 'v0.1.0';
    const major = Number(match[1]);
    const minor = Number(match[2]);
    return 'v' + major + '.' + (minor + 1) + '.0';
  }

  async function githubRequest(path, options, token){
    const headers = {
      Accept: 'application/vnd.github+json',
      Authorization: 'Bearer ' + token,
      'X-GitHub-Api-Version': '2022-11-28'
    };
    if (options && options.body) headers['Content-Type'] = 'application/json';
    const response = await fetch('https://api.github.com' + path, {
      method: (options && options.method) || 'GET',
      headers,
      body: options && options.body ? JSON.stringify(options.body) : undefined
    });
    const text = await response.text();
    let data = null;
    if (text){
      try { data = JSON.parse(text); } catch (err) { data = { message: text }; }
    }
    if (!response.ok){
      const msg = data && data.message ? data.message : ('GitHub API error ' + response.status);
      throw new Error(msg);
    }
    return data;
  }

  async function waitForForkRepo(fullName, token){
    for (let i = 0; i < 20; i++){
      try {
        return await githubRequest('/repos/' + fullName, { method: 'GET' }, token);
      } catch (err) {
        await wait(1500);
      }
    }
    throw new Error('Fork is still provisioning. Try again in a few seconds.');
  }

  async function upsertRepoFile(fullName, path, content, token, message){
    let sha = null;
    try {
      const existing = await githubRequest('/repos/' + fullName + '/contents/' + path, { method: 'GET' }, token);
      sha = existing && existing.sha ? existing.sha : null;
    } catch (err) {
      sha = null;
    }
    const body = {
      message,
      content: toBase64Utf8(content)
    };
    if (sha) body.sha = sha;
    await githubRequest('/repos/' + fullName + '/contents/' + path, {
      method: 'PUT',
      body
    }, token);
  }

  async function createMinorTag(fullName, tagName, token){
    const repo = await githubRequest('/repos/' + fullName, { method: 'GET' }, token);
    const branch = repo.default_branch;
    const ref = await githubRequest('/repos/' + fullName + '/git/ref/heads/' + encodeURIComponent(branch), { method: 'GET' }, token);
    const sha = ref && ref.object ? ref.object.sha : '';
    if (!sha) throw new Error('Could not resolve default branch SHA.');

    try {
      await githubRequest('/repos/' + fullName + '/git/refs', {
        method: 'POST',
        body: {
          ref: 'refs/tags/' + tagName,
          sha
        }
      }, token);
    } catch (err) {
      const msg = err && err.message ? String(err.message) : '';
      if (!msg.toLowerCase().includes('reference already exists')) throw err;
    }
  }

  async function handleForkAction(entry, forkBtn){
    if (!entry){
      alert('Write your fork line first.');
      return;
    }
    if (!REPO_OWNER || !REPO_NAME){
      window.open(buildForkUrl(), '_blank', 'noopener');
      return;
    }

    const originalText = forkBtn.textContent;
    forkBtn.disabled = true;
    forkBtn.textContent = 'Copying...';

    try {
      const tenetLine = '105 ' + entry;
      try {
        await navigator.clipboard.writeText(tenetLine);
      } catch (err) {
        legacyCopy(tenetLine);
      }
      forkBtn.textContent = 'Opening fork...';
      window.open(buildForkUrl(), '_blank', 'noopener');
      alert('Fork opened. The single 105 tenet line has been copied to your clipboard. Set repository description to your tenet, then run the action to stamp line 105.');
    } finally {
      forkBtn.disabled = false;
      forkBtn.textContent = originalText;
    }
  }

  const copyBtn = document.querySelector('.copy-btn');
  let copyResetTimer = null;
  function legacyCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener('click', async () => {
    const text = buildManifestoText();
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (err) {
      ok = legacyCopy(text);
    }
    copyBtn.textContent = ok ? 'COPIED' : 'ERROR';
    if (copyResetTimer) clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(() => { copyBtn.textContent = 'COPY'; }, 1500);
  });

  signaturesBtn.addEventListener('click', () => {
    if (signaturesOpen) closeSignatures(true);
    else openSignatures(true);
  });

  signaturesCloseBtn.addEventListener('click', () => closeSignatures(true));

  signaturesOverlay.addEventListener('click', (e) => {
    if (e.target === signaturesOverlay) closeSignatures(true);
  });

  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#', '').trim().toLowerCase();
    if (hash === 'signatures'){
      if (!signaturesOpen) openSignatures(false);
    } else if (signaturesOpen) {
      closeSignatures(false);
    }
  });

  rebuildDotsIfNeeded();
  mountSlot(slotA, 0);
  mountSlot(slotB, 1);
  updateVersionLabel();
  if (window.location.hash.replace('#', '').trim().toLowerCase() === 'signatures'){
    openSignatures(false);
  }
  requestAnimationFrame(tick);
</script>
